[package]
name = "azusa"
version = "0.1.0"
edition = "2021"

[lib]
name = "azusa"
path = "src/lib.rs"

[[bin]]
name = "sift1m_benchmark"
path = "benchmark/sift1m_benchmark.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ordered-float = "3.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
